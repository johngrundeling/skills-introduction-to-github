# Reconciliation Agent — standalone scheduled Worker.
# Deploy from this folder:  npx wrangler deploy
# Secrets:  npx wrangler secret put PAYSTACK_SECRET_KEY
#           npx wrangler secret put GHL_API_TOKEN
name = "biokissed-reconcile"
main = "reconcile.worker.js"
compatibility_date = "2024-11-01"

# Runs every 30 minutes
[triggers]
crons = ["*/30 * * * *"]

# D1 ledger (biokissed-orders)
[[d1_databases]]
binding = "DB"
database_name = "biokissed-orders"
database_id = "a02ffd09-0bca-4787-ab7d-1219a7b6c5d8"

# Non-secret vars (set the real BioKissed values before deploy).
# PAYSTACK_SECRET_KEY and GHL_API_TOKEN are SECRETS — set with `wrangler secret put`, not here.
[vars]
GHL_LOCATION_ID = ""      # BioKissed SA location id (NOT Career Legends)
GHL_PIPELINE_ID = ""      # BioKissed orders pipeline id
GHL_STAGE_ID = ""         # target stage id (e.g. "Paid")
